[project]
name = "orion-tony-stark-demo"
version = "0.1.0"
description = "Orion - A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[groq,sarvam,silero,openai]>=1.5.1",
    "openai",
    "python-dotenv",
]

[project.scripts]
orion = "server:main"
orion_voice = "agent_orion:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]

